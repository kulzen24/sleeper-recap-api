name = "fantasy-recap"
main = "src/entry.py"
compatibility_date = "2025-11-01"
compatibility_flags = ["python_workers"]

[vars]
# Default league can be overridden per-request via ?league_id=..., but most
# routes default to this league if none is provided.
DEFAULT_LEAGUE_ID = "<your-league-id>"

# Stores draft/published recap write-ups and superlatives, keyed per week.
# This id belongs to the original author's Cloudflare account — if you're
# deploying your own copy, run `npx wrangler kv namespace create RECAP_NOTES`
# and replace it with the id that prints.
[[kv_namespaces]]
binding = "RECAP_NOTES"
id = "<your-kv-namespace-id>"
